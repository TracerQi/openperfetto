# Binder Transaction Analysis Skill
# Binder 事务分析

id: binder_transaction_analysis
name: Binder Transaction Analysis
description: |
  分析 Binder 事务，包括调用耗时、调用方和被调用方信息。
version: "1.0"
type: sql_query
scene: binder
tags:
  - binder
  - ipc
  - transaction

parameters:
  - name: process_name
    type: string
    required: false
    description: "目标进程名（可选）"
  - name: min_dur_ms
    type: float
    required: false
    default: 1.0
    description: "最小事务时间（毫秒）"
  - name: limit
    type: integer
    required: false
    default: 100
    description: "返回结果数量限制"

sql_template: |
  SELECT
    s.id AS slice_id,
    s.ts,
    ROUND(s.dur / 1e6, 2) AS dur_ms,
    s.name AS transaction_name,
    t.name AS thread_name,
    p.name AS process_name
  FROM slice s
  JOIN thread_track tt ON s.track_id = tt.id
  JOIN thread t ON tt.utid = t.utid
  JOIN process p ON t.upid = p.upid
  WHERE (s.name LIKE 'binder%' OR s.name LIKE 'Binder%' OR s.category = 'binder')
    AND s.dur >= ${min_dur_ms} * 1e6
    ${process_name ? "AND p.name LIKE '%" + process_name + "%'" : ""}
  ORDER BY s.dur DESC
  LIMIT ${limit}

output_schema:
  columns:
    - name: slice_id
      type: integer
    - name: ts
      type: timestamp
      unit: ns
    - name: dur_ms
      type: float
      unit: ms
    - name: transaction_name
      type: string
    - name: thread_name
      type: string
    - name: process_name
      type: string
  display_level: detail

related_skills:
  - binder_timeout_analysis
