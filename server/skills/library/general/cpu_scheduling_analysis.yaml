# CPU Scheduling Analysis Skill
# CPU 调度分析

id: cpu_scheduling_analysis
name: CPU Scheduling Analysis
description: |
  分析 CPU 调度情况，包括各 CPU 核心的使用率和调度分布。
version: "1.0"
type: sql_query
scene: general
tags:
  - cpu
  - scheduling
  - sched

parameters:
  - name: time_range_start
    type: integer
    required: false
    description: "分析起始时间（纳秒）"
  - name: time_range_end
    type: integer
    required: false
    description: "分析结束时间（纳秒）"

sql_template: |
  SELECT
    cpu,
    COUNT(*) AS slice_count,
    ROUND(SUM(dur) / 1e6, 2) AS total_running_ms,
    ROUND(AVG(dur) / 1e6, 4) AS avg_slice_ms,
    ROUND(MAX(dur) / 1e6, 2) AS max_slice_ms,
    COUNT(DISTINCT utid) AS unique_threads
  FROM sched_slice
  WHERE dur > 0
    ${time_range_start ? "AND ts >= " + time_range_start : ""}
    ${time_range_end ? "AND ts <= " + time_range_end : ""}
  GROUP BY cpu
  ORDER BY cpu

output_schema:
  columns:
    - name: cpu
      type: integer
      description: "CPU 核心 ID"
    - name: slice_count
      type: integer
      description: "调度切片数"
    - name: total_running_ms
      type: float
      unit: ms
      description: "总运行时间"
    - name: avg_slice_ms
      type: float
      unit: ms
      description: "平均切片时间"
    - name: max_slice_ms
      type: float
      unit: ms
      description: "最大切片时间"
    - name: unique_threads
      type: integer
      description: "唯一线程数"
  display_level: summary

related_skills:
  - thread_state_analysis
  - cpu_frequency_analysis
