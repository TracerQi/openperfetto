# App Startup Breakdown Skill
# 应用启动阶段拆解

id: app_startup_breakdown
name: App Startup Breakdown
description: |
  分析应用启动过程，将启动时间拆解为各个阶段：
  进程创建、Application初始化、Activity创建、首帧渲染等。
version: "1.0"
type: sql_query
scene: startup
tags:
  - startup
  - cold_start
  - performance
  - breakdown

parameters:
  - name: package_name
    type: string
    required: true
    description: "应用的完整 Android 包名，例如 com.android.settings。不要使用应用简称。"
  - name: time_range_start
    type: integer
    required: false
    description: "分析起始时间（纳秒）"

prerequisites:
  description: "这是启动分析的入口技能，应最先调用"
  depends_on: []

sql_template: |
  WITH startup_slices AS (
    SELECT
      s.id,
      s.ts,
      s.dur,
      s.name,
      CASE
        WHEN s.name LIKE 'bindApplication%' THEN 'bind_application'
        WHEN s.name LIKE 'activityStart%' THEN 'activity_start'
        WHEN s.name LIKE 'activityResume%' THEN 'activity_resume'
        WHEN s.name LIKE 'Choreographer%doFrame%' THEN 'first_frame'
        WHEN s.name LIKE 'inflate%' THEN 'layout_inflate'
        WHEN s.name LIKE 'measure%' OR s.name LIKE 'onMeasure%' THEN 'measure'
        WHEN s.name LIKE 'layout%' OR s.name LIKE 'onLayout%' THEN 'layout'
        WHEN s.name LIKE 'draw%' OR s.name LIKE 'onDraw%' THEN 'draw'
        WHEN s.name LIKE 'ContentProvider%' OR s.name LIKE 'installProvider%' THEN 'content_provider'
        WHEN s.name LIKE 'SharedPreferences%' OR s.name LIKE 'SharedPrefs%' THEN 'shared_prefs'
        WHEN s.name LIKE 'Binder%' OR s.name LIKE 'binder%' THEN 'binder_call'
        WHEN s.name LIKE 'ClassLoader%' OR s.name LIKE 'loadClass%' THEN 'class_loading'
        WHEN s.name LIKE 'Application%' OR s.name LIKE 'handleBindApplication%' THEN 'application_init'
        WHEN s.name LIKE 'GC%' OR s.name LIKE 'art::gc%' THEN 'gc'
        ELSE 'other'
      END AS phase
    FROM slice s
    JOIN thread_track tt ON s.track_id = tt.id
    JOIN thread t ON tt.utid = t.utid
    JOIN process p ON t.upid = p.upid
    WHERE p.name LIKE '%${package_name}%'
      AND t.is_main_thread = 1
      ${time_range_start ? "AND s.ts >= " + time_range_start : ""}
      AND s.dur > 0
  ),
  phase_summary AS (
    SELECT
      phase,
      COUNT(*) AS slice_count,
      ROUND(SUM(dur) / 1e6, 2) AS total_dur_ms,
      ROUND(AVG(dur) / 1e6, 2) AS avg_dur_ms,
      ROUND(MAX(dur) / 1e6, 2) AS max_dur_ms
    FROM startup_slices
    GROUP BY phase
  ),
  total_info AS (
    SELECT
      ROUND(SUM(dur) / 1e6, 2) AS grand_total_ms,
      COUNT(*) AS total_slices
    FROM startup_slices
  )
  SELECT
    ps.phase,
    ps.slice_count,
    ps.total_dur_ms,
    ps.avg_dur_ms,
    ps.max_dur_ms,
    ROUND(ps.total_dur_ms * 100.0 / ti.grand_total_ms, 1) AS pct_of_total,
    ti.grand_total_ms AS _grand_total_ms
  FROM phase_summary ps
  CROSS JOIN total_info ti
  ORDER BY ps.total_dur_ms DESC

output_schema:
  columns:
    - name: phase
      type: string
      description: "启动阶段（包括 'other' 未分类阶段）"
    - name: slice_count
      type: integer
      description: "切片数量"
    - name: total_dur_ms
      type: float
      unit: ms
      description: "总耗时"
    - name: avg_dur_ms
      type: float
      unit: ms
      description: "平均耗时"
    - name: max_dur_ms
      type: float
      unit: ms
      description: "最大耗时"
    - name: pct_of_total
      type: float
      unit: "%"
      description: "占总启动耗时百分比"
    - name: _grand_total_ms
      type: float
      unit: ms
      description: "启动过程主线程 slice 总耗时（元数据）"
  display_level: summary

related_skills:
  - startup_blocking_calls
  - startup_cpu_analysis
