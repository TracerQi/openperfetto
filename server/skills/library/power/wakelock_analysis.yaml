# Wakelock Analysis Skill
# Wakelock 分析

id: wakelock_analysis
name: Wakelock Analysis
description: |
  分析 Wakelock 使用情况，找出持有时间过长的唤醒锁。
version: "1.0"
type: sql_query
scene: power
tags:
  - power
  - wakelock
  - battery

parameters:
  - name: process_name
    type: string
    required: false
    description: "目标进程名（可选，不填则分析所有进程）"
  - name: min_dur_ms
    type: float
    required: false
    default: 1000.0
    description: "最小持有时间（毫秒）"
  - name: limit
    type: integer
    required: false
    default: 50
    description: "返回结果数量限制"

sql_template: |
  SELECT
    s.ts,
    ROUND(s.dur / 1e6, 2) AS dur_ms,
    s.name AS wakelock_name,
    t.name AS thread_name,
    p.name AS process_name
  FROM slice s
  JOIN thread_track tt ON s.track_id = tt.id
  JOIN thread t ON tt.utid = t.utid
  JOIN process p ON t.upid = p.upid
  WHERE (s.name LIKE '%wakelock%' OR s.name LIKE '%WakeLock%' OR s.category = 'power')
    AND s.dur >= ${min_dur_ms} * 1e6
    ${process_name ? "AND p.name LIKE '%" + process_name + "%'" : ""}
  ORDER BY s.dur DESC
  LIMIT ${limit}

output_schema:
  columns:
    - name: ts
      type: timestamp
      unit: ns
    - name: dur_ms
      type: float
      unit: ms
    - name: wakelock_name
      type: string
    - name: thread_name
      type: string
    - name: process_name
      type: string
  display_level: detail

related_skills:
  - cpu_frequency_analysis
