# CPU Frequency Analysis Skill
# CPU 频率分析

id: cpu_frequency_analysis
name: CPU Frequency Analysis
description: |
  分析 CPU 频率变化情况，包括各核心的频率分布和变化趋势。
version: "1.0"
type: sql_query
scene: power
tags:
  - power
  - cpu
  - frequency
  - dvfs

parameters:
  - name: cpu_id
    type: integer
    required: false
    description: "CPU 核心 ID（可选，不填则分析所有核心）"
  - name: time_range_start
    type: integer
    required: false
    description: "分析起始时间（纳秒）"
  - name: time_range_end
    type: integer
    required: false
    description: "分析结束时间（纳秒）"

sql_template: |
  SELECT
    cct.cpu AS cpu_id,
    ROUND(AVG(c.value) / 1000.0, 0) AS avg_freq_mhz,
    ROUND(MAX(c.value) / 1000.0, 0) AS max_freq_mhz,
    ROUND(MIN(c.value) / 1000.0, 0) AS min_freq_mhz,
    COUNT(*) AS sample_count
  FROM counter c
  JOIN cpu_counter_track cct ON c.track_id = cct.id
  WHERE cct.name = 'cpufreq'
    ${cpu_id ? "AND cct.cpu = " + cpu_id : ""}
    ${time_range_start ? "AND c.ts >= " + time_range_start : ""}
    ${time_range_end ? "AND c.ts <= " + time_range_end : ""}
  GROUP BY cct.cpu
  ORDER BY cct.cpu

output_schema:
  columns:
    - name: cpu_id
      type: integer
    - name: avg_freq_mhz
      type: float
      unit: MHz
    - name: max_freq_mhz
      type: float
      unit: MHz
    - name: min_freq_mhz
      type: float
      unit: MHz
    - name: sample_count
      type: integer
  display_level: summary

related_skills:
  - wakelock_analysis
  - cpu_scheduling_analysis
