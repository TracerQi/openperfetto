# Lock Contention Analysis Skill
# 锁竞争分析

id: lock_contention_analysis
name: Lock Contention Analysis
description: |
  分析锁竞争情况，找出等待时间过长的锁。
version: "1.0"
type: sql_query
scene: lock
tags:
  - lock
  - contention
  - mutex
  - synchronization

parameters:
  - name: process_name
    type: string
    required: true
    description: "目标进程名"
  - name: min_wait_ms
    type: float
    required: false
    default: 1.0
    description: "最小等待时间（毫秒）"
  - name: limit
    type: integer
    required: false
    default: 50
    description: "返回结果数量限制"

sql_template: |
  SELECT
    s.id AS slice_id,
    s.ts,
    ROUND(s.dur / 1e6, 2) AS wait_ms,
    s.name AS lock_name,
    t.name AS thread_name,
    p.name AS process_name
  FROM slice s
  JOIN thread_track tt ON s.track_id = tt.id
  JOIN thread t ON tt.utid = t.utid
  JOIN process p ON t.upid = p.upid
  WHERE p.name LIKE '%${process_name}%'
    AND (s.name LIKE '%Lock%' OR s.name LIKE '%Monitor%' OR s.name LIKE '%contention%' OR s.name LIKE '%mutex%')
    AND s.dur >= ${min_wait_ms} * 1e6
  ORDER BY s.dur DESC
  LIMIT ${limit}

output_schema:
  columns:
    - name: slice_id
      type: integer
    - name: ts
      type: timestamp
      unit: ns
    - name: wait_ms
      type: float
      unit: ms
    - name: lock_name
      type: string
    - name: thread_name
      type: string
    - name: process_name
      type: string
  display_level: detail

related_skills:
  - mutex_wait_analysis
